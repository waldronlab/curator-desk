name: Quarto render & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  # Also triggered by bioanalyzer-backend's notify-curator-desk workflow when
  # its data/curator_predictions.csv changes, with the commit to read it from.
  workflow_dispatch:
    inputs:
      predictions_ref:
        description: bioanalyzer-backend branch or commit SHA to read predictions from
        required: false
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev

      - name: Set up renv and restore R dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Run R unit tests
        run: Rscript tests/testthat.R

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      # BioAnalyzer's published predictions. A commit SHA (sent by the notify
      # workflow) gives a URL raw.githubusercontent.com hasn't cached yet, so a
      # rebuild right after a push can't pick up the previous file.
      - name: Point the site at BioAnalyzer predictions
        env:
          PREDICTIONS_REF: ${{ github.event.inputs.predictions_ref || 'main' }}
        run: |
          if ! [[ "$PREDICTIONS_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid predictions_ref: $PREDICTIONS_REF"
            exit 1
          fi
          echo "CURATOR_DATA_URL=https://raw.githubusercontent.com/waldronlab/bioanalyzer-backend/${PREDICTIONS_REF}/data/curator_predictions.csv" >> "$GITHUB_ENV"

      - name: Render Quarto site
        env:
          GITHUB_REPO: https://github.com/${{ github.repository }}
        run: quarto render

      - name: Verify build output
        run: test -f docs/index.html || (echo "::error::docs/index.html missing" && exit 1)

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: https://waldronlab.io/curator-desk/
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
